name: Local build and browser tests
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '41 9 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-e2e:
    name: Local build and browser tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:17
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: ci-only-not-a-secret
          POSTGRES_DB: tenant_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U test -d tenant_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CI: 'true'
      E2E_LOCAL: 'true'
      DATABASE_URL: postgresql://test:ci-only-not-a-secret@127.0.0.1:5432/tenant_test
      DIRECT_DATABASE_URL: postgresql://test:ci-only-not-a-secret@127.0.0.1:5432/tenant_test
      PROVIDER_DATABASE_URL: postgresql://test:ci-only-not-a-secret@127.0.0.1:5432/provider_test
      TENANT_APP_URL: http://127.0.0.1:3000
      PROVIDER_PORTAL_URL: http://127.0.0.1:3001
      TEST_OWNER_EMAIL: owner@test.com
      TEST_OWNER_PASSWORD: ci-local-password
      TEST_PROVIDER_EMAIL: provider@test.com
      TEST_PROVIDER_PASSWORD: ci-local-password
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Create isolated provider database
        run: PGPASSWORD=ci-only-not-a-secret createdb -h 127.0.0.1 -U test provider_test
      - name: Apply schemas to disposable databases only
        run: |
          npx prisma db push --schema=prisma/schema.prisma
          DATABASE_URL="$PROVIDER_DATABASE_URL" DIRECT_DATABASE_URL="$PROVIDER_DATABASE_URL" npx prisma db push --schema=apps/provider-portal/prisma/schema.prisma
      - run: node .github/release/seed-local-e2e.mjs
      - name: Build tenant and provider apps locally
        run: |
          npm run build --workspace=tenant-app
          DATABASE_URL="$PROVIDER_DATABASE_URL" DIRECT_DATABASE_URL="$PROVIDER_DATABASE_URL" npm run build --workspace=provider-portal
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: Run existing browser suite against local apps
        run: npm run test:e2e:playwright
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: local-browser-report
          path: playwright-report/
          retention-days: 3
