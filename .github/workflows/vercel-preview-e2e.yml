name: Manual browser checks
on:
  workflow_dispatch:
    inputs:
      tenant_url:
        description: Explicit test environment URL for the tenant app
        required: true
        type: string
      provider_url:
        description: Explicit test environment URL for the provider portal
        required: true
        type: string
permissions:
  contents: read
jobs:
  browser-checks:
    name: Manual browser checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: Run existing browser suite
        env:
          TENANT_APP_URL: ${{ inputs.tenant_url }}
          PROVIDER_PORTAL_URL: ${{ inputs.provider_url }}
          CI: 'true'
        run: npm run test:e2e:playwright
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: failure()
        with:
          name: manual-browser-report
          path: playwright-report/
          retention-days: 3
